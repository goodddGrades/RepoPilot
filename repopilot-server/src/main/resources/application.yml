spring:
  application:
    name: repopilot-server
    # 应用版本：由 health 接口与 /actuator/info 暴露，便于确认部署版本
    version: 0.1.0-SNAPSHOT
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 本地开发：把仓库根目录的 .env 当作 properties 加载，避免在仓库内硬编码凭据。
  # 两个路径分别覆盖 “在 repopilot-server/ 下启动” 与 “在仓库根目录启动” 两种方式；
  # optional 前缀保证没有 .env 时不会启动失败（此时连接配置会提示缺失变量）。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./../.env[.properties]
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      # 与契约的 20 MiB 文件上限对齐：超限在容器层就被拒绝（413），
      # 而不是先把整个文件读进内存再交给解析器判断。
      max-file-size: 20MB
      max-request-size: 21MB
  threads:
    virtual:
      # Java 21 虚拟线程：仅作为执行器，不改变任何业务语义
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-connections: 8192
    threads:
      max: 200

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.repopilot.modules
  # 只扫描 JsonNode / Instant 两个处理器：它们各自的 Java 类型唯一，不会误伤其他列。
  # ULID 处理器刻意不在此扫描（库里有 CHAR(64) 哈希列），由 Mapper 参数显式引用。
  type-handlers-package: com.repopilot.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # 探针分组显式声明，避免依赖指标被默认规则带进 liveness：
      # liveness 只反映进程自身（JVM/应用上下文），外部依赖故障不得触发容器重启；
      # readiness 反映“能否对外提供业务请求”，必须包含真实外部依赖。
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,rabbit
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
    description: RepoPilot 轨迹评测与质量分析平台 - 核心后端

repopilot:
  storage:
    # V1 只有 local；未知取值会在启动时直接失败（不静默回退）
    type: ${STORAGE_TYPE:local}
    local:
      # 必须是**不进版本库**的目录。默认 var/ 已在 .gitignore 中排除；
      # 换到别处时同样要确认不在 Git 工作区内。
      root: ${STORAGE_LOCAL_ROOT:var/storage}
      max-bytes: 67108864
  trace:
    # 游标签名密钥。留空时进程用一次性随机密钥：重启后旧游标返回 400（前端回到第一页），
    # 这样不会在仓库里留一个"所有部署共用"的默认密钥。
    cursor-secret: ${REPOPILOT_CURSOR_SECRET:}
  artifact:
    cleanup:
      # 只清理"有对象、无元数据"且超过宽限期的文件；有元数据的证据永不删除
      enabled: true
      grace-seconds: 86400
      interval-ms: 3600000
      initial-delay-ms: 600000
  worker:
    # 留空 => /internal/v1 一律 401（fail closed）。本机运行时从 .env 注入。
    token: ${REPOPILOT_WORKER_TOKEN:}
    # 逗号分隔；Spring 自动拆成 List。留空表示不限制 workerId（凭证仍然必须正确）。
    allowed-ids: ${REPOPILOT_WORKER_IDS:}
    lease: 60s
    heartbeat-interval: 15s
    max-tasks-limit: 10
    max-attempts-per-run: 2
    # 评测 Job 的尝试预算与 Run 分开：算子是短任务，多给一次重试的成本远低于重跑 Agent
    max-attempts-per-job: 3
    retry-backoff-first: 5s
    retry-backoff-second: 15s
    task-deadline: 10m
    scan-interval: 2s
    scan-interval-ms: 2000
    scheduler-enabled: true

# TASK-013：Outbox 发布与保留期。
#
# 前缀是 **app.repopilot** 而不是 repopilot —— 与 OutboxPublisherService /
# OutboxScheduler / RetentionService 里的 @Value("${app.repopilot...}") 一致。
# TASK-011 把这些参数写成了 app.repopilot.*，而本文件里当时只有 repopilot.*
# （storage/trace/worker），于是**所有 outbox 参数都在吃 @Value 里的默认值**：
# 改 yml 不会有任何效果，而日志与文档都让人以为改了。这正是"配置看起来存在
# 但实际不生效"的典型。保持两处前缀一致，否则同类问题还会再发生。
app:
  repopilot:
    outbox:
      # 发布循环节拍；领取在短事务内完成，网络 IO 在事务外
      poll-interval-ms: 1000
      # 单次发布的租约：确认回写必须租约有效且 claimToken 匹配（fencing）
      lease-seconds: 30
      # 有限重试上限。超过后置 FAILED 等人工重新投递，**永不自动删除**
      max-attempts: 8
      batch-limit: 50
    retention:
      # Outbox 保留天数：只清理已PUBLISHED 且超期的行。
      # PENDING / FAILED 永不自动删除——它们是排障与人工重放的唯一线索。
      outbox-days: ${REPOPILOT_RETENTION_OUTBOX_DAYS:7}
      # Inbox 是幂等闸门：记录被删后同一条消息再投会被当作新消息重新执行副作用。
      # 因此必须显著长于 Outbox 重试窗口能覆盖的时间跨度，默认 30 天。
      inbox-days: ${REPOPILOT_RETENTION_INBOX_DAYS:30}
      # 分批删除：一次删光百万行会持锁数分钟并阻塞所有写入
      batch-size: ${REPOPILOT_RETENTION_BATCH_SIZE:500}
      max-batches-per-run: 20
      interval-ms: 3600000
      initial-delay-ms: 600000

logging:
  level:
    root: INFO
    com.repopilot: INFO
