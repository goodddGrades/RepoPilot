spring:
  application:
    name: repopilot-server
    # 应用版本：由 health 接口与 /actuator/info 暴露，便于确认部署版本
    version: 0.1.0-SNAPSHOT
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 本地开发：把仓库根目录的 .env 当作 properties 加载，避免在仓库内硬编码凭据。
  # 两个路径分别覆盖 “在 repopilot-server/ 下启动” 与 “在仓库根目录启动” 两种方式；
  # optional 前缀保证没有 .env 时不会启动失败（此时连接配置会提示缺失变量）。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./../.env[.properties]
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      # Java 21 虚拟线程：仅作为执行器，不改变任何业务语义
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-connections: 8192
    threads:
      max: 200

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.repopilot.modules
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
    description: RepoPilot 轨迹评测与质量分析平台 - 核心后端

logging:
  level:
    root: INFO
    com.repopilot: INFO
