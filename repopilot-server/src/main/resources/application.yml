spring:
  application:
    name: repopilot-server
    # 应用版本：由 health 接口与 /actuator/info 暴露，便于确认部署版本
    version: 0.1.0-SNAPSHOT
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 本地开发：把仓库根目录的 .env 当作 properties 加载，避免在仓库内硬编码凭据。
  # 两个路径分别覆盖 “在 repopilot-server/ 下启动” 与 “在仓库根目录启动” 两种方式；
  # optional 前缀保证没有 .env 时不会启动失败（此时连接配置会提示缺失变量）。
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./../.env[.properties]
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      # 与契约的 20 MiB 文件上限对齐：超限在容器层就被拒绝（413），
      # 而不是先把整个文件读进内存再交给解析器判断。
      max-file-size: 20MB
      max-request-size: 21MB
  threads:
    virtual:
      # Java 21 虚拟线程：仅作为执行器，不改变任何业务语义
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-connections: 8192
    threads:
      max: 200

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.repopilot.modules
  # 只扫描 JsonNode / Instant 两个处理器：它们各自的 Java 类型唯一，不会误伤其他列。
  # ULID 处理器刻意不在此扫描（库里有 CHAR(64) 哈希列），由 Mapper 参数显式引用。
  type-handlers-package: com.repopilot.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # 探针分组显式声明，避免依赖指标被默认规则带进 liveness：
      # liveness 只反映进程自身（JVM/应用上下文），外部依赖故障不得触发容器重启；
      # readiness 反映“能否对外提供业务请求”，必须包含真实外部依赖。
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,rabbit
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${spring.application.version}
    description: RepoPilot 轨迹评测与质量分析平台 - 核心后端

repopilot:
  storage:
    # V1 只有 local；未知取值会在启动时直接失败（不静默回退）
    type: ${STORAGE_TYPE:local}
    local:
      # 必须是**不进版本库**的目录。默认 var/ 已在 .gitignore 中排除；
      # 换到别处时同样要确认不在 Git 工作区内。
      root: ${STORAGE_LOCAL_ROOT:var/storage}
      max-bytes: 67108864

logging:
  level:
    root: INFO
    com.repopilot: INFO
