# 集成测试专用配置：只连接测试号 MySQL，不读取开发 .env，避免测试误连开发库。
# 变量缺失时 Spring 直接启动失败（而不是静默跳过），这样"没跑"与"跑过"不会混淆。
spring:
  datasource:
    url: jdbc:mysql://${REPOPILOT_IT_DB_HOST}:${REPOPILOT_IT_DB_PORT:3306}/${REPOPILOT_IT_DB_NAME:repopilot_it}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${REPOPILOT_IT_DB_USER:root}
    password: ${REPOPILOT_IT_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      pool-name: repopilot-it
  flyway:
    enabled: true
    # 测试只允许正向迁移，禁止 clean：数据库验收要求"空库能建起来"，
    # 而不是"每次先删库再建起来"。
    clean-disabled: true
    validate-on-migrate: true

mybatis:
  configuration:
    map-underscore-to-camel-case: true

repopilot:
  storage:
    type: local
    local:
      # 测试上传文件写到 target/ 下：该目录已被 .gitignore 排除，
      # 同时保证测试不会污染开发环境的 var/storage。
      root: ${REPOPILOT_IT_STORAGE_ROOT:target/it-storage}
      max-bytes: 67108864
  worker:
    # 测试专用凭证（不是生产凭据）。集成测试用它访问 /internal/v1。
    token: it-worker-token
    # 关闭后台扫描：用例显式调用维护方法，避免"测试跑着跑着后台线程把状态改了"。
    scheduler-enabled: false
    lease: 60s
    max-attempts-per-run: 2
    retry-backoff-first: 1s
    retry-backoff-second: 1s
    task-deadline: 5m
  import:
    # 用例显式调用 resume 驱动导入：异步自动处理会让"处理到一半"无法稳定构造
    auto-process: false
    resume-on-startup: false
  trace:
    # 测试专用签名密钥（不是生产凭据）：让同一进程内的游标稳定可复现
    cursor-secret: it-cursor-secret
  artifact:
    cleanup:
      # 关闭后台清理：用例直接调用服务方法，避免后台线程在断言过程中删文件
      enabled: false
  retention:
    # 保留期清理由用例显式调用；关掉定时器避免它在断言中途删掉待检查的行
    interval-ms: 3600000
    initial-delay-ms: 3600000

# TASK-013：关闭 Outbox 的后台发布循环。
#
# **为什么必须关**：这个循环以 1 秒节拍扫描全表并发布 PENDING 事件。
# 它会抢走**别的用例**刚插入的 PENDING 记录并发布掉，于是
# "这条事件还没被发布"这类断言偶发失败——而单独跑那个用例却通过。
#
# 这种"混跑失败、单跑通过"的失败模式最难查：它看起来像产品缺陷，
# 实际是测试环境里有个后台线程在改被测对象。
#
# 注意前缀是 **app.repopilot**（与 @Value 里的写法一致），
# 写成 repopilot.outbox 会被静默忽略——那正是"配置看起来存在但实际不生效"。
# 需要发布的用例都显式调用 publisher.scanOnce()，不依赖后台循环。
app:
  repopilot:
    outbox:
      scheduler-enabled: false

# TASK-013：RabbitTopologyIT 需要真实 broker。
#
# 这些变量**没有默认值**：缺失时 Spring 启动会因占位符无法解析而失败，
# 而测试类本身用 @EnabledIfEnvironmentVariable 整体跳过。
# 两者分工明确：类级跳过 = "这台机器没有 broker，不测"；
# 配置缺失报错 = "你说要测但没给连接信息"，是配置错误而不是跳过理由。
spring.rabbitmq.host: ${REPOPILOT_IT_RABBIT_HOST:}
spring.rabbitmq.port: ${REPOPILOT_IT_RABBIT_PORT:5672}
spring.rabbitmq.username: ${REPOPILOT_IT_RABBIT_USER:}
spring.rabbitmq.password: ${REPOPILOT_IT_RABBIT_PASSWORD:}
spring.rabbitmq.publisher-confirm-type: correlated
spring.rabbitmq.publisher-returns: true
spring.rabbitmq.connection-timeout: 5s

# TASK-014：集成测试用 Redis（限流的共享状态存储）。
#
# 与 RabbitMQ 的区别：这里给了本机默认值而不是留空。原因是不需要 Redis 的
# 用例（绝大多数）不该因为"没配 Redis"而启动失败——限流默认 FAIL_OPEN，
# 没有 Redis 只是不节流。真正验证限流的 RateLimitIT 用环境变量门控，
# 没 Redis 时明确跳过并写进报告，不会伪装成通过。
spring.data.redis.host: ${REPOPILOT_IT_REDIS_HOST:127.0.0.1}
spring.data.redis.port: ${REPOPILOT_IT_REDIS_PORT:16379}
spring.data.redis.password: ${REPOPILOT_IT_REDIS_PASSWORD:}
spring.data.redis.database: ${REPOPILOT_IT_REDIS_DATABASE:0}
spring.data.redis.timeout: 2s
spring.data.redis.connect-timeout: 2s

repopilot.rate-limit:
  enabled: true
  # 独立环境段：同一台 Redis 上 it 与 dev 的桶互不干扰。
  environment: it
  trust-forwarded-for: false
  policies:
    # 绝大多数集成测试会连续创建实验/批次，几百个请求是常态。
    # 这里把额度放到实际不可能触发的量级，让"限流"只由 RateLimitIT 验证，
    # 避免其它用例偶发 429 变成难以复现的 flaky。
    api-write:
      capacity: 100000
      refill-tokens-per-second: 100000
      cost-per-request: 1
      ttl: 10m
      failure-mode: FAIL_OPEN
      paths:
        - /api/v1/experiments
        - /api/v1/experiments/*/start
        - /api/v1/experiments/*/evaluation-batches
      methods: [POST]
    api-bulk:
      capacity: 100000
      refill-tokens-per-second: 100000
      cost-per-request: 1
      ttl: 10m
      failure-mode: FAIL_OPEN
      paths:
        - /api/v1/imports
        - /api/v1/dataset-versions/*/cases:import
        - /api/v1/artifacts
      methods: [POST]

logging:
  level:
    root: WARN
    com.repopilot: INFO
    org.springframework.test: WARN
    # 拓扑声明的 WARN 是真实信息（队列参数不符会被删除重建），
    # 但在测试里刷屏会淹没真正的失败信息
    com.repopilot.common.reliability.messaging: INFO
