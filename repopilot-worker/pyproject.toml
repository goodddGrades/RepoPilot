[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-worker"
version = "0.1.0"
description = "RepoPilot Agent 执行与评测 Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    # RabbitMQ 消费（TASK-013）；仅在 WORKER_RABBITMQ_ENABLED=true 时真正 import
    "pika==1.3.2",
    # Redis 分布式限流（TASK-014）
    "redis==5.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

# Lua 脚本是运行时资源（不是调试文件），打包时必须带上，
# 否则安装后 register_script 会读不到文件而在首个请求时失败。
[tool.setuptools.package-data]
"app.ratelimit" = ["*.lua"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
